<svg xmlns="http://www.w3.org/2000/svg" width="720" height="450" viewBox="0 0 720 450" role="img" aria-labelledby="title">
<title id="title">GBA screen coordinates and direction of increasing x and y</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526377"/></marker></defs>
<rect width="100%" height="100%" rx="12" fill="#f8fafc"/>
<g font-family="Segoe UI, Arial, sans-serif" fill="#172b4d"><text x="24" y="34" font-size="23">240 × 160 visible coordinates</text><rect x="155" y="70" width="480" height="320" fill="#e0eef5" stroke="#527286"/><text x="162" y="94" font-size="16">(0, 0)</text><text x="545" y="94" font-size="16">(239, 0)</text><text x="162" y="378" font-size="16">(0, 159)</text><text x="520" y="378" font-size="16">(239, 159)</text><path d="M155,48 L635,48" stroke="#526377" stroke-width="2" marker-end="url(#arrow)" fill="none"/><text x="337" y="44" font-size="15">x increases</text><path d="M126,70 L126,390" stroke="#526377" stroke-width="2" marker-end="url(#arrow)" fill="none"/><text x="22" y="230" font-size="15">y increases</text><text x="155" y="426" font-size="16">Rows are horizontal; host output format is a separate choice.</text></g></svg>
