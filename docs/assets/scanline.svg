<svg xmlns="http://www.w3.org/2000/svg" width="790" height="380" viewBox="0 0 790 380" role="img" aria-labelledby="title">
<title id="title">Nominal horizontal and vertical GBA display intervals</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526377"/></marker></defs>
<rect width="100%" height="100%" rx="12" fill="#f8fafc"/>
<g font-family="Segoe UI, Arial, sans-serif" fill="#172b4d"><text x="24" y="34" font-size="23">Nominal scanline timing — 1,232 guest cycles</text><rect x="24" y="74" width="560" height="70" rx="7" fill="#e0eef5" stroke="#527286"/><text x="304.0" y="115.0" text-anchor="middle" font-size="17">Drawing interval: 960 cycles</text><rect x="584" y="74" width="176" height="70" rx="7" fill="#e8e3f5" stroke="#527286"/><text x="672.0" y="115.0" text-anchor="middle" font-size="17">HBlank: 272</text><text x="24" y="168" font-size="15">0</text><text x="554" y="168" font-size="15">960</text><text x="719" y="168" font-size="15">1,232</text><rect x="24" y="215" width="515" height="55" rx="7" fill="#e0eef5" stroke="#527286"/><text x="281.5" y="248.5" text-anchor="middle" font-size="17">Lines 0–159: visible image</text><rect x="539" y="215" width="221" height="55" rx="7" fill="#e8e3f5" stroke="#527286"/><text x="649.5" y="248.5" text-anchor="middle" font-size="17">160–227: nonvisible</text><text x="24" y="315" font-size="18">228 × 1,232 = 280,896 cycles per frame</text><text x="24" y="350" font-size="16">Status flag edges are separate rules: VBlank flag clears on line 227.</text></g></svg>
