<svg xmlns="http://www.w3.org/2000/svg" width="730" height="590" viewBox="0 0 730 590" role="img" aria-labelledby="title">
<title id="title">GBA memory map with physical sizes and shared ROM windows</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526377"/></marker></defs>
<rect width="100%" height="100%" rx="12" fill="#f8fafc"/>
<g font-family="Segoe UI, Arial, sans-serif" fill="#172b4d"><text x="24" y="34" font-size="22">Memory regions — base addresses; not to scale</text><rect x="190" y="60" width="310" height="34" rx="7" fill="#e0eef5" stroke="#527286"/><text x="345.0" y="83.0" text-anchor="middle" font-size="17">BIOS</text><text x="24" y="83" font-size="16">0x00000000</text><text x="520" y="83" font-size="16">16 KiB</text><rect x="190" y="103" width="310" height="34" rx="7" fill="#e0eef5" stroke="#527286"/><text x="345.0" y="126.0" text-anchor="middle" font-size="17">EWRAM</text><text x="24" y="126" font-size="16">0x02000000</text><text x="520" y="126" font-size="16">256 KiB</text><rect x="190" y="146" width="310" height="34" rx="7" fill="#e0eef5" stroke="#527286"/><text x="345.0" y="169.0" text-anchor="middle" font-size="17">IWRAM</text><text x="24" y="169" font-size="16">0x03000000</text><text x="520" y="169" font-size="16">32 KiB</text><rect x="190" y="189" width="310" height="34" rx="7" fill="#e0eef5" stroke="#527286"/><text x="345.0" y="212.0" text-anchor="middle" font-size="17">I/O registers</text><text x="24" y="212" font-size="16">0x04000000</text><text x="520" y="212" font-size="16">sparse</text><rect x="190" y="232" width="310" height="34" rx="7" fill="#e0eef5" stroke="#527286"/><text x="345.0" y="255.0" text-anchor="middle" font-size="17">Palette RAM</text><text x="24" y="255" font-size="16">0x05000000</text><text x="520" y="255" font-size="16">1 KiB</text><rect x="190" y="275" width="310" height="34" rx="7" fill="#e0eef5" stroke="#527286"/><text x="345.0" y="298.0" text-anchor="middle" font-size="17">VRAM</text><text x="24" y="298" font-size="16">0x06000000</text><text x="520" y="298" font-size="16">96 KiB</text><rect x="190" y="318" width="310" height="34" rx="7" fill="#e0eef5" stroke="#527286"/><text x="345.0" y="341.0" text-anchor="middle" font-size="17">OAM</text><text x="24" y="341" font-size="16">0x07000000</text><text x="520" y="341" font-size="16">1 KiB</text><rect x="190" y="361" width="310" height="34" rx="7" fill="#e0eef5" stroke="#527286"/><text x="345.0" y="384.0" text-anchor="middle" font-size="17">ROM WS0</text><text x="24" y="384" font-size="16">0x08000000</text><text x="520" y="384" font-size="16">up to 32 MiB</text><rect x="190" y="404" width="310" height="34" rx="7" fill="#e0eef5" stroke="#527286"/><text x="345.0" y="427.0" text-anchor="middle" font-size="17">ROM WS1</text><text x="24" y="427" font-size="16">0x0A000000</text><text x="520" y="427" font-size="16">same ROM</text><rect x="190" y="447" width="310" height="34" rx="7" fill="#e0eef5" stroke="#527286"/><text x="345.0" y="470.0" text-anchor="middle" font-size="17">ROM WS2</text><text x="24" y="470" font-size="16">0x0C000000</text><text x="520" y="470" font-size="16">same ROM</text><rect x="190" y="490" width="310" height="34" rx="7" fill="#e0eef5" stroke="#527286"/><text x="345.0" y="513.0" text-anchor="middle" font-size="17">SRAM / Flash</text><text x="24" y="513" font-size="16">0x0E000000</text><text x="520" y="513" font-size="16">device-dependent</text><text x="24" y="565" font-size="15">Gaps, mirrors and device protocols are explained in the memory chapter.</text></g></svg>
