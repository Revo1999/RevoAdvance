<svg xmlns="http://www.w3.org/2000/svg" width="870" height="560" viewBox="0 0 870 560" role="img" aria-labelledby="title">
<title id="title">GBA hardware data flow and desktop host boundary</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526377"/></marker></defs>
<rect width="100%" height="100%" rx="12" fill="#f8fafc"/>
<g font-family="Segoe UI, Arial, sans-serif" fill="#172b4d"><text x="24" y="32" font-size="23">GBA hardware → host outputs</text><rect x="320" y="55" width="200" height="44" rx="7" fill="#e0eef5" stroke="#527286"/><text x="420.0" y="83.0" text-anchor="middle" font-size="17">ROM / Cartridge</text><rect x="40" y="145" width="180" height="50" rx="7" fill="#e0eef5" stroke="#527286"/><text x="130.0" y="176.0" text-anchor="middle" font-size="17">ARM7TDMI CPU</text><rect x="285" y="145" width="270" height="50" rx="7" fill="#e0eef5" stroke="#527286"/><text x="420.0" y="176.0" text-anchor="middle" font-size="17">Memory / Bus</text><rect x="615" y="55" width="195" height="44" rx="7" fill="#e0eef5" stroke="#527286"/><text x="712.5" y="83.0" text-anchor="middle" font-size="17">Logical keypad</text><path d="M420,99 L420,145" stroke="#526377" stroke-width="2" marker-end="url(#arrow)" fill="none"/><path d="M220,170 L285,170" stroke="#526377" stroke-width="2" marker-end="url(#arrow)" fill="none"/><path d="M285,183 L220,183" stroke="#526377" stroke-width="2" marker-end="url(#arrow)" fill="none"/><path d="M713,99 L555,153" stroke="#526377" stroke-width="2" marker-end="url(#arrow)" fill="none"/><rect x="35" y="270" width="130" height="44" rx="7" fill="#e0eef5" stroke="#527286"/><text x="100.0" y="298.0" text-anchor="middle" font-size="17">PPU</text><path d="M420,195 L100,270" stroke="#526377" stroke-width="2" marker-end="url(#arrow)" fill="none"/><rect x="205" y="270" width="130" height="44" rx="7" fill="#e0eef5" stroke="#527286"/><text x="270.0" y="298.0" text-anchor="middle" font-size="17">DMA</text><path d="M420,195 L270,270" stroke="#526377" stroke-width="2" marker-end="url(#arrow)" fill="none"/><rect x="375" y="270" width="130" height="44" rx="7" fill="#e0eef5" stroke="#527286"/><text x="440.0" y="298.0" text-anchor="middle" font-size="17">Timers</text><path d="M420,195 L440,270" stroke="#526377" stroke-width="2" marker-end="url(#arrow)" fill="none"/><rect x="545" y="270" width="130" height="44" rx="7" fill="#e0eef5" stroke="#527286"/><text x="610.0" y="298.0" text-anchor="middle" font-size="17">IRQ</text><path d="M420,195 L610,270" stroke="#526377" stroke-width="2" marker-end="url(#arrow)" fill="none"/><rect x="715" y="270" width="130" height="44" rx="7" fill="#e0eef5" stroke="#527286"/><text x="780.0" y="298.0" text-anchor="middle" font-size="17">APU</text><path d="M420,195 L780,270" stroke="#526377" stroke-width="2" marker-end="url(#arrow)" fill="none"/><rect x="25" y="372" width="260" height="44" rx="7" fill="#e0eef5" stroke="#527286"/><text x="155.0" y="400.0" text-anchor="middle" font-size="17">240 × 160 framebuffer</text><path d="M100,314 L155,372" stroke="#526377" stroke-width="2" marker-end="url(#arrow)" fill="none"/><rect x="610" y="372" width="230" height="44" rx="7" fill="#e0eef5" stroke="#527286"/><text x="725.0" y="400.0" text-anchor="middle" font-size="17">Audio samples</text><path d="M780,314 L725,372" stroke="#526377" stroke-width="2" marker-end="url(#arrow)" fill="none"/><text x="340" y="402" font-size="16">Core owns guest time</text><path d="M20,445 H850" stroke="#527286" stroke-dasharray="6 5"/><text x="340" y="469" font-size="16">Desktop host boundary</text><rect x="25" y="490" width="260" height="44" rx="7" fill="#e8e3f5" stroke="#527286"/><text x="155.0" y="518.0" text-anchor="middle" font-size="17">Vulkan → GLFW window</text><path d="M155,416 L155,490" stroke="#526377" stroke-width="2" marker-end="url(#arrow)" fill="none"/><rect x="610" y="490" width="230" height="44" rx="7" fill="#e8e3f5" stroke="#527286"/><text x="725.0" y="518.0" text-anchor="middle" font-size="17">Audio device</text><path d="M725,416 L725,490" stroke="#526377" stroke-width="2" marker-end="url(#arrow)" fill="none"/></g></svg>
