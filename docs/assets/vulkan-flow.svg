<svg xmlns="http://www.w3.org/2000/svg" width="730" height="485" viewBox="0 0 730 485" role="img" aria-labelledby="title">
<title id="title">GBA framebuffer uploaded to Vulkan and presented to a monitor</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526377"/></marker></defs>
<rect width="100%" height="100%" rx="12" fill="#f8fafc"/>
<g font-family="Segoe UI, Arial, sans-serif" fill="#172b4d"><text x="24" y="35" font-size="22">Host presentation: preserve the pixels Core already produced</text><rect x="130" y="65" width="470" height="48" rx="7" fill="#e0eef5" stroke="#527286"/><text x="365.0" y="95.0" text-anchor="middle" font-size="17">PPU framebuffer: 240 × 160</text><path d="M365,113 L365,140" stroke="#526377" stroke-width="2" marker-end="url(#arrow)" fill="none"/><rect x="130" y="140" width="470" height="48" rx="7" fill="#e8e3f5" stroke="#527286"/><text x="365.0" y="170.0" text-anchor="middle" font-size="17">Upload / copy through staging</text><path d="M365,188 L365,215" stroke="#526377" stroke-width="2" marker-end="url(#arrow)" fill="none"/><rect x="130" y="215" width="470" height="48" rx="7" fill="#e8e3f5" stroke="#527286"/><text x="365.0" y="245.0" text-anchor="middle" font-size="17">Vulkan sampled image</text><path d="M365,263 L365,290" stroke="#526377" stroke-width="2" marker-end="url(#arrow)" fill="none"/><rect x="130" y="290" width="470" height="48" rx="7" fill="#e8e3f5" stroke="#527286"/><text x="365.0" y="320.0" text-anchor="middle" font-size="17">Fullscreen triangle / quad</text><path d="M365,338 L365,365" stroke="#526377" stroke-width="2" marker-end="url(#arrow)" fill="none"/><rect x="130" y="365" width="470" height="48" rx="7" fill="#e8e3f5" stroke="#527286"/><text x="365.0" y="395.0" text-anchor="middle" font-size="17">Swapchain → monitor</text><text x="38" y="455" font-size="17">Nearest sampling • integer scaling • 3:2 aspect ratio • explicit lifetime</text></g></svg>
